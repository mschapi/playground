name: Codex general backend patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-general-backend.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/codex-general-backend-patch.py
      - name: Validate
        run: |
          node --check src/index.js
          node --check src/server.js
          node --check web/app.js
          node --check src/video/ffmpeg.js
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generaliza backend publico"
            git push
          fi
