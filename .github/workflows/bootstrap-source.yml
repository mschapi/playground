name: Bootstrap source

on:
  push:
    paths:
      - ".github/workflows/bootstrap-source.yml"
      - ".bootstrap/source-url.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository with Codex source archive
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat .bootstrap/source-url.txt)"
          curl -fsSL "$URL" -o /tmp/source.zip
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source

          # GitHub's runtime token cannot create/update workflow files.
          # Keep .github controlled by the connected GitHub app instead.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .bootstrap -exec rm -rf {} +
          rsync -a --exclude='.github/' /tmp/source/ ./

          cat > index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0;url=./web/">
          <title>Script Media Pipeline</title>
          <a href="./web/">Abrir app</a>
          HTML

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish media pipeline app"
          git push
