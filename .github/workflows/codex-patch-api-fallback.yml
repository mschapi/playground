name: Codex patch API fallback

on:
  push:
    paths:
      - ".github/workflows/codex-patch-api-fallback.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply frontend API fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime

          fallback_fn = """
          async function tryLocalBackendFallback() {
            if (localStorage.getItem('playgroundApiBase')) return false;
            if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return false;
            if (API_BASE === 'http://localhost:8787') return false;

            const previousBase = API_BASE;
            API_BASE = 'http://localhost:8787';
            try {
              const health = await api('/api/health', { timeoutMs: 3500 });
              els.envStatus.textContent = health.apiReady ? 'APIs locales listas' : 'Backend local en prueba';
              els.envStatus.className = health.apiReady ? 'status-pill ready' : 'status-pill warn';
              els.dryRunToggle.checked = !health.apiReady;
              return true;
            } catch {
              API_BASE = previousBase;
              return false;
            }
          }
          """.strip()

          def update_app(path):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              text = text.replace('const API_BASE = resolveApiBase();', 'let API_BASE = resolveApiBase();', 1)
              text = text.replace(
                  '  await Promise.all([loadHealth(), loadPreflight()]);',
                  '  await loadHealth();\n  await loadPreflight();'
              )
              text = text.replace(
                  "  } catch {\n    els.envStatus.textContent = 'Sin backend';\n    els.envStatus.className = 'status-pill warn';\n  }\n}\n\nasync function loadPreflight() {",
                  "  } catch {\n    if (await tryLocalBackendFallback()) return;\n    els.envStatus.textContent = 'Sin backend';\n    els.envStatus.className = 'status-pill warn';\n  }\n}\n\n" + fallback_fn + "\n\nasync function loadPreflight() {"
              )
              p.write_text(text, encoding='utf-8', newline='\n')

          for path in ['web/app.js', 'docs/app.js']:
              update_app(path)

          for path in ['web/index.html', 'docs/index.html']:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text = text.replace('20260824-duration', '20260824-fallback')
              p.write_text(text, encoding='utf-8', newline='\n')

          Path('docs/deploy-version.txt').write_text('api-fallback ' + datetime.datetime.utcnow().isoformat(timespec='seconds') + 'Z\n', encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check web/app.js
          node --check docs/app.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js docs/app.js web/index.html docs/index.html docs/deploy-version.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Pages backend fallback"
          git push
