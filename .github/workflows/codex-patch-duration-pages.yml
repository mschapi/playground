name: Codex patch duration and Pages

on:
  push:
    paths:
      - ".github/workflows/codex-patch-duration-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply duration, prompt, and Pages fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime
          import json
          import shutil

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          cfg_path = Path('config/pipeline.config.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['sceneSecondsPerWord'] = 0.41
          cfg['wordsPerSecond'] = 2.44
          cfg['minSceneDurationSeconds'] = 1.5
          cfg['maxSceneDurationSeconds'] = 18
          cfg_path.write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          path = 'src/config.js'
          text = read(path)
          if 'sceneSecondsPerWord' not in text:
              text = text.replace(
                  "    fps: numberEnv('FPS', base.fps),",
                  "    fps: numberEnv('FPS', base.fps),\n    sceneSecondsPerWord: numberEnv(\n      'SCENE_SECONDS_PER_WORD',\n      base.sceneSecondsPerWord ?? 0.41\n    ),"
              )
          write(path, text)

          path = 'src/utils/text.js'
          text = read(path)
          text = text.replace(
              '  const estimated = Math.ceil(words / config.wordsPerSecond);',
              "  const secondsPerWord = Number(config.sceneSecondsPerWord || 0.41);\n  const estimated = roundToHalfSecond(words * secondsPerWord);"
          )
          if 'function roundToHalfSecond' not in text:
              text = text.replace(
                  "export function summarizeQuery(text, maxWords = 8) {",
                  "function roundToHalfSecond(value) {\n  return Math.max(0.5, Math.round(Number(value || 0) * 2) / 2);\n}\n\nexport function summarizeQuery(text, maxWords = 8) {"
              )
          write(path, text)

          path = 'src/scenes.js'
          text = read(path)
          text = text.replace(
              '    const duration = Number(scene.duration_seconds) || estimateDurationSeconds(scriptText, config);',
              '    const estimatedDuration = estimateDurationSeconds(scriptText, config);\n    const duration = normalizeGeneratedDuration(scene.duration_seconds, estimatedDuration);'
          )
          if 'function normalizeGeneratedDuration' not in text:
              text = text.rstrip() + "\n\nfunction normalizeGeneratedDuration(value, estimatedDuration) {\n  const raw = Number(value);\n  if (!Number.isFinite(raw) || raw <= 0) return estimatedDuration;\n  if (raw < estimatedDuration * 0.6 || raw > estimatedDuration * 1.5) return estimatedDuration;\n  return Math.round(raw * 2) / 2;\n}\n"
          write(path, text)

          path = 'src/server.js'
          text = read(path)
          text = text.replace(
              '    const scriptText = String(scene.script_text ?? scene.narration ?? previous.script_text ?? previous.narration ?? \'\').trim();\n    const durationSeconds = toPositiveNumber(scene.duration_seconds ?? previous.duration_seconds, 4);',
              '    const scriptText = String(scene.script_text ?? scene.narration ?? previous.script_text ?? previous.narration ?? \'\').trim();\n    const estimatedDuration = estimateDurationSeconds(scriptText);\n    const hasExistingScenes = Boolean(existingScenes?.length);\n    const durationSeconds = hasExistingScenes\n      ? toPositiveNumber(scene.duration_seconds ?? previous.duration_seconds, estimatedDuration)\n      : normalizeGeneratedDuration(scene.duration_seconds ?? previous.duration_seconds, estimatedDuration);'
          )
          if 'function estimateDurationSeconds(text)' not in text:
              marker = "function findSelectedAsset(assets, key) {"
              helper = "function estimateDurationSeconds(text) {\n  const words = String(text || '').trim().split(/\\s+/).filter(Boolean).length;\n  const secondsPerWord = Number(config.sceneSecondsPerWord || 0.41);\n  const min = Number(config.minSceneDurationSeconds || 1.5);\n  const max = Number(config.maxSceneDurationSeconds || 18);\n  const estimated = Math.round(Math.max(0.5, words * secondsPerWord) * 2) / 2;\n  return Math.min(Math.max(estimated, min), max);\n}\n\nfunction normalizeGeneratedDuration(value, estimatedDuration) {\n  const raw = Number(value);\n  if (!Number.isFinite(raw) || raw <= 0) return estimatedDuration;\n  if (raw < estimatedDuration * 0.6 || raw > estimatedDuration * 1.5) return estimatedDuration;\n  return Math.round(raw * 2) / 2;\n}\n\n"
              text = text.replace(marker, helper + marker)
          write(path, text)

          openai_prompt = r'''import { fetchJson } from '../utils/http.js';
          import { normalizeScenes } from '../scenes.js';

          const N8N_SCENE_PROMPT = `Sos un asistente de preproduccion audiovisual especializado en material de stock (Pexels, Shutterstock) y Google Images.

          Tu objetivo es traducir un guion en escenas visuales concretas, filmables y buscables.

          REGLAS:
          1. Dividi el guion segun unidad visual y narrativa.
          Una nueva escena aparece cuando cambia la accion, el sujeto, el contexto o aparece una idea que requiere otra imagen o clip.
          Cada escena debe poder representarse con una imagen o clip claro.

          2. Duracion:
          Calcula duration_seconds segun el texto exacto de cada escena.
          Formula obligatoria: duration_seconds = cantidad_de_palabras_de_script_text * 0.41.
          Redondea al medio segundo mas cercano.
          Usa minimo 1.5 segundos para micro escenas y maximo 18 segundos para escenas largas.
          No uses duraciones fijas de 5 a 10 segundos si el texto es corto.
          Ejemplos:
          - "Abre una libreta." tiene 3 palabras, duration_seconds 1.5.
          - 10 palabras duran aproximadamente 4 segundos.
          - 25 palabras duran aproximadamente 10.5 segundos.

          3. Para cada escena devolve:
          scene_id
          script_text
          visual_intent
          search_query
          asset_type
          duration_seconds
          orientation
          image_prompt

          4. search_query:
          Debe estar en ingles, con estructura sujeto + accion + contexto.
          Debe representar el sentido de la escena, no una traduccion literal.
          Debe ser algo que exista como material de stock o en Google Images.
          Evita queries genericas o abstractas como "innovation", "future", "technology concept", "people working".

          Ejemplos correctos:
          "young man checking bank account on phone at night"
          "woman stressed looking at credit card bill at kitchen table"
          "developer coding on multiple monitors in dark room"
          "employee being watched by boss in office"

          5. Varia los planos cuando tenga sentido:
          close up, wide shot, over the shoulder, hands detail.

          6. visual_intent:
          En espanol. Explica que se quiere mostrar y por que representa la escena.

          7. asset_type:
          Siempre "video".

          8. orientation:
          Siempre "horizontal".

          9. image_prompt:
          Debe estar en ingles, ser detallado para IA, y describir una escena visible concreta.
          Debe terminar con este estilo obligatorio:
          "pixel art, soviet propaganda style, red color palette, futuristic hacker aesthetic, high contrast, digital dystopia"
          No uses conceptos abstractos en image_prompt.

          10. Output:
          Responde solo JSON valido. El JSON debe ser un array. Sin texto adicional.

          Guion:

          {{$json.script_text}}`;

          export async function splitScenesWithOpenAI(script, config) {
            if (!config.openai.apiKey) {
              throw new Error('Falta OPENAI_API_KEY para partir escenas con LLM');
            }

            const response = await fetchJson(
              'https://api.openai.com/v1/responses',
              {
                method: 'POST',
                headers: {
                  Authorization: 'Bearer ' + config.openai.apiKey,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  model: config.openai.textModel,
                  input: [
                    {
                      role: 'user',
                      content: [
                        {
                          type: 'input_text',
                          text: buildPrompt(script)
                        }
                      ]
                    }
                  ]
                })
              },
              'OpenAI Responses scene split'
            );

            const text = extractOutputText(response);
            const parsed = JSON.parse(extractJson(text));
            const rawScenes = Array.isArray(parsed) ? parsed : parsed.scenes;
            if (!Array.isArray(rawScenes)) {
              throw new Error('La respuesta del LLM no contiene un array de escenas');
            }
            return normalizeScenes(rawScenes, config);
          }

          function buildPrompt(script) {
            return N8N_SCENE_PROMPT.replace('{{$json.script_text}}', script);
          }

          function extractOutputText(response) {
            if (response.output_text) return response.output_text;
            const parts = [];
            for (const item of response.output || []) {
              for (const content of item.content || []) {
                if (content.text) parts.push(content.text);
              }
            }
            if (!parts.length) {
              throw new Error('OpenAI no devolvio output_text parseable');
            }
            return parts.join('\n');
          }

          function extractJson(text) {
            const trimmed = String(text || '').trim();
            if (trimmed.startsWith('[') || trimmed.startsWith('{')) return trimmed;

            const arrayStart = trimmed.indexOf('[');
            const objectStart = trimmed.indexOf('{');
            const starts = [arrayStart, objectStart].filter((index) => index >= 0);
            if (!starts.length) throw new Error('La respuesta del LLM no contiene JSON');

            const start = Math.min(...starts);
            const opener = trimmed[start];
            const closer = opener === '[' ? ']' : '}';
            const end = trimmed.lastIndexOf(closer);
            if (end <= start) throw new Error('La respuesta del LLM contiene JSON incompleto');

            return trimmed.slice(start, end + 1);
          }
          '''
          lines = [line[10:] if line.startswith('          ') else line for line in openai_prompt.splitlines()]
          write('src/llm/openai.js', '\n'.join(lines).strip() + '\n')

          path = 'web/index.html'
          text = read(path)
          text = text.replace('href="/styles.css"', 'href="styles.css?v=20260824-duration"')
          text = text.replace('href="styles.css?v=20260817-339ebc7"', 'href="styles.css?v=20260824-duration"')
          text = text.replace('src="/app.js"', 'src="app.js?v=20260824-duration"')
          text = text.replace('src="app.js?v=20260817-339ebc7"', 'src="app.js?v=20260824-duration"')
          write(path, text)

          path = 'web/app.js'
          text = read(path)
          text = text.replace("return 'http://localhost:8787';", "return '';", 1)
          write(path, text)

          Path('docs').mkdir(exist_ok=True)
          shutil.copyfile('web/index.html', 'docs/index.html')
          shutil.copyfile('web/app.js', 'docs/app.js')
          shutil.copyfile('web/styles.css', 'docs/styles.css')
          write('docs/deploy-version.txt', 'duration-pages-fix ' + datetime.datetime.utcnow().isoformat(timespec='seconds') + 'Z\n')
          PY

      - name: Validate JavaScript
        run: |
          node --check src/index.js
          node --check src/server.js
          node --check src/llm/openai.js
          node --check src/scenes.js
          node --check web/app.js
          node --check docs/app.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/pipeline.config.json src/config.js src/utils/text.js src/scenes.js src/server.js src/llm/openai.js web/index.html web/app.js docs/index.html docs/app.js docs/styles.css docs/deploy-version.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix scene duration and Pages runtime"
          git push
