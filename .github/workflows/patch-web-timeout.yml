name: Patch web timeout

on:
  push:
    paths:
      - ".github/workflows/patch-web-timeout.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch public backend timeout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('web/app.js')
          text = path.read_text(encoding='utf-8-sig')
          text = text.replace("const health = await api('/api/health');", "const health = await api('/api/health', { timeoutMs: 3500 });")
          text = text.replace("state.preflight = await api('/api/preflight');", "state.preflight = await api('/api/preflight', { timeoutMs: 3500 });")
          old = """async function api(path, options = {}) {
            const response = await fetch(API_BASE + path, {
              headers: { 'Content-Type': 'application/json' },
              ...options
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || 'Error de servidor');
            return data;
          }"""
          new = """async function api(path, options = {}) {
            const { timeoutMs = 0, ...fetchOptions } = options;
            const controller = timeoutMs > 0 ? new AbortController() : null;
            const timeout = controller ? window.setTimeout(() => controller.abort(), timeoutMs) : null;
            const requestOptions = {
              headers: { 'Content-Type': 'application/json' },
              ...fetchOptions
            };
            if (controller && !requestOptions.signal) requestOptions.signal = controller.signal;

            try {
              const response = await fetch(API_BASE + path, requestOptions);
              const data = await response.json().catch(() => ({}));
              if (!response.ok) throw new Error(data.error || 'Error de servidor');
              return data;
            } catch (error) {
              if (error.name === 'AbortError') throw new Error('Backend no responde');
              throw error;
            } finally {
              if (timeout) window.clearTimeout(timeout);
            }
          }"""
          if old in text:
              text = text.replace(old, new)
          elif 'const { timeoutMs = 0, ...fetchOptions } = options;' not in text:
              raise SystemExit('api function shape did not match')
          path.write_text(text, encoding='utf-8')
          PY
          node --check web/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Add backend timeout to public UI"
          git push
