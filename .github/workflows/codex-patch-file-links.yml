name: Codex patch backend file links

on:
  push:
    paths:
      - ".github/workflows/codex-patch-file-links.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prefix backend file URLs in frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime

          helper = """
          function fileLink(url) {
            const value = String(url || '');
            if (!value) return '';
            if (/^(https?:|data:|blob:)/i.test(value)) return value;
            return API_BASE + value;
          }
          """.strip()

          for path in ['web/app.js', 'docs/app.js']:
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              text = text.replace('video.src = job.video.url;', 'video.src = fileLink(job.video.url);')
              text = text.replace('link.href = job.video.url;', 'link.href = fileLink(job.video.url);')
              text = text.replace('video.src = asset.url;', 'video.src = fileLink(asset.url);')
              text = text.replace('img.src = asset.url;', 'img.src = fileLink(asset.url);')
              if 'function fileLink(url)' not in text:
                  text = text.replace('function isAssetVideo(asset) {', helper + '\n\nfunction isAssetVideo(asset) {')
              p.write_text(text, encoding='utf-8', newline='\n')

          for path in ['web/index.html', 'docs/index.html']:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text = text.replace('20260824-apibase', '20260824-filelinks')
              p.write_text(text, encoding='utf-8', newline='\n')

          Path('docs/deploy-version.txt').write_text('backend-file-links ' + datetime.datetime.utcnow().isoformat(timespec='seconds') + 'Z\n', encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check web/app.js
          node --check docs/app.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js docs/app.js web/index.html docs/index.html docs/deploy-version.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Prefix backend file links in Pages UI"
          git push
