services:
  - type: web
    name: playground-backend
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8787
      - key: OUTPUT_ROOT
        value: /tmp/playground-jobs
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: VIDEO_FFMPEG_PRESET
        value: ultrafast
      - key: VIDEO_FFMPEG_CRF
        value: 24
      - key: CORS_ORIGIN
        value: https://mschapi.github.io
      - key: DRIVE_UPLOAD
        value: false
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      - key: PUBLIC_RATE_LIMIT
        value: true
      - key: PUBLIC_MAX_JOBS_PER_HOUR
        value: 3
      - key: PUBLIC_MAX_ACTIONS_PER_MINUTE
        value: 60
      - key: PUBLIC_MAX_CONCURRENT_OPERATIONS
        value: 2
      - key: MAX_UPLOAD_JSON_MB
        value: 60
      - key: MAX_RENDER_JSON_MB
        value: 100
      - key: OPENAI_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_ZONE
        value: serp_api1
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DRIVE_PARENT_FOLDER_ID
        sync: false

