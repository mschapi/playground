services:
  - type: web
    name: playground-backend
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8787
      - key: OUTPUT_ROOT
        value: /tmp/playground-jobs
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: CORS_ORIGIN
        value: https://mschapi.github.io
      - key: DRIVE_UPLOAD
        value: false
      - key: PIPELINE_ACCESS_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_ZONE
        value: serp_api1
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DRIVE_PARENT_FOLDER_ID
        sync: false
